# Memoria limitada de proposito: esta maquina tem 12 GB e roda Teams, Edge,
# VS Code e um emulador. Com os valores padrao o build morria com
# "Failed to commit metaspace" / "insufficient memory".
#
# in-process: compila o Kotlin DENTRO do daemon do Gradle, em vez de subir um
# segundo processo (KotlinCompileDaemon). Duas vantagens aqui:
#   1) uma JVM a menos, ~800 MB economizados;
#   2) acaba o "Unable to delete directory app\build\kotlin\...\caches-jvm",
#      que era o daemon do Kotlin segurando o proprio cache aberto.
kotlin.compiler.execution.strategy=in-process
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Sem compilacao incremental do Kotlin. Motivo: o cache incremental vive em
# app\build\kotlin\...\cacheable\caches-jvm, e no Windows esse diretorio fica
# preso por outro processo (a extensao Gradle for Java do VS Code), fazendo
# todo build morrer com "Unable to delete directory". Sem incremental o
# caches-jvm nem chega a ser criado.
# Custo: ~45s de compilacao completa em vez de alguns segundos. Neste projeto,
# com pouco mais de uma duzia de arquivos, e um preco baixo pela estabilidade.
kotlin.incremental=false

# Um modulo so: paralelismo nao acelera nada e ainda abre workers extras.
org.gradle.parallel=false
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---------------------------------------------------------------- versao
# A Play Store exige um appVersionCode MAIOR a cada envio (nunca repete,
# nunca diminui). O appVersionName e o que o usuario ve na loja.
appVersionCode=1
appVersionName=1.0
